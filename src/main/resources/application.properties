# ==============================================================
# OFF3D STUDIO - APLICACAO BACKEND
# ==============================================================
spring.application.name=off3d-studio

# ==============================================================
# CONFIGURACOES DO BANCO DE DADOS (POSTGRESQL)
# ==============================================================
# Substitua 'localhost:5432' pelo IP do seu banco e 'off3d_db' pelo nome do schema
spring.datasource.url=jdbc:postgresql://localhost:5433/off3d_db
spring.datasource.username=impressao3d123
spring.datasource.password=senhaimpressao3d123
spring.datasource.driver-class-name=org.postgresql.Driver

# ==============================================================
# CONFIGURACOES DO JPA / HIBERNATE
# ==============================================================
# 'update' cria ou atualiza as tabelas automaticamente com base nas suas classes @Entity
spring.jpa.hibernate.ddl-auto=update

# Mostra as queries SQL no console (otimo para debug)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ==============================================================
# CONFIGURACOES DA API (OPCIONAL)
# ==============================================================
# Porta onde a aplicacao vai rodar (padrao 8080)
server.servlet.context-path=/
server.port=8080
# Define o fuso horario para evitar erros em datas de pedidos
spring.jackson.time-zone=America/Sao_Paulo

# ==============================================================
# CONFIGURACOES DE SEGURANCA (JWT)
# ==============================================================
# Troque por uma frase longa e aleatoria em producao
api.security.token.secret=${JWT_SECRET:off3d-studio-secret-key-2026}