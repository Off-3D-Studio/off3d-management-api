# ==============================================================
# CONFIGURACOES DE TESTE (H2 EM MEMORIA)
# ==============================================================

# Driver e URL do banco de dados H2
spring.datasource.url=jdbc:h2:mem:off3d_test_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Hibernate configurado para o H2
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop

# Log SQL apenas para debug de testes (opcional)
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Configura o fuso horario para testes
spring.jackson.time-zone=America/Sao_Paulo